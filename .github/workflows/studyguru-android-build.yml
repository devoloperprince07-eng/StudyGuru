name: StudyGuru Android build

on:
  workflow_dispatch:
  push:
    branches: [ android-native ]
    paths:
      - 'android-native/**'
      - '.github/workflows/studyguru-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode release signing key (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/studyguru-release.jks
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Build release APK and bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/studyguru-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          gradle :app:bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studyguru-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed release APK and AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: studyguru-release-signed
          path: |
            android-native/app/build/outputs/apk/release/app-release.apk
            android-native/app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned release AAB for signing setup
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' || secrets.ANDROID_KEYSTORE_PASSWORD == '' || secrets.ANDROID_KEY_ALIAS == '' || secrets.ANDROID_KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: studyguru-release-unsigned-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab
