name: StudyGuru Android build

on:
  workflow_dispatch:
  push:
    branches: [ android-native ]
    paths:
      - 'android-native/**'
      - '.github/workflows/studyguru-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Build unsigned release bundle
        run: gradle :app:bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studyguru-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: studyguru-release-unsigned-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab
